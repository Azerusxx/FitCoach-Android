<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit Coach</title>
<style>
:root{--bg:#070b16;--card:#0d1426;--tx:#e6ecff;--mu:#7f8db3;--ac:#4cc2ff;--bd:#1f3a63;--ok:#5bf0a8;--bad:#ff5d7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:radial-gradient(ellipse at top,#14204a 0,#070b16 60%) fixed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:12px 12px 80px;max-width:640px;margin:auto}
h1{font-size:18px;margin:6px 0 10px;letter-spacing:3px;color:var(--ac);text-shadow:0 0 12px var(--ac);text-align:center}h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:2px;color:var(--ac)}h2::before{content:'[ '}h2::after{content:' ]'}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:1;padding:9px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}

.c{background:linear-gradient(160deg,#0f1a33,#0a1122);border:1px solid var(--bd);border-radius:4px;padding:12px;margin-bottom:10px;box-shadow:0 0 14px rgba(76,194,255,.15),inset 0 0 20px rgba(76,194,255,.05)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:130px;font-family:ui-monospace,monospace;font-size:13px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b{width:100%;margin-top:10px;padding:11px;border:1px solid var(--ac);border-radius:4px;background:linear-gradient(90deg,#1b4fd8,#7c3aed);color:#fff;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;box-shadow:0 0 14px rgba(124,58,237,.6)}.bar i{background:linear-gradient(90deg,#4cc2ff,#a855f7);box-shadow:0 0 8px var(--ac)}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:8px 12px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:16px;font-size:13px}.chip.on{background:var(--ac);color:#06101f;border-color:var(--ac);font-weight:700}.chip.ok{border-color:var(--ok)}.chat{display:flex;flex-direction:column;gap:6px;margin:12px 0}.bb{max-width:88%;padding:8px 11px;border-radius:12px;font-size:14px}.bb.sys{background:#14233f;align-self:flex-start}.bb.me{background:var(--ac);color:#06101f;align-self:flex-end}.inrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}.inrow button{padding:0 18px;border:0;border-radius:8px;background:var(--ac);color:#06101f;font-weight:700;font-size:18px}.rows3{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;align-items:center;margin-top:8px}.lk{background:none;border:0;color:var(--mu);font-size:13px;text-decoration:underline;padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px 2px;text-align:left;border-bottom:1px solid var(--bd)}
</style></head><body>
<h1>[ SYSTEM ] FIT COACH</h1>
<nav id="nav"></nav>
<div id="v"></div><div id="tm"></div>
<script>
const K='fitcoach_v1';
const DEF={p:{name:'',sex:'',year:'',h:'',kcal:2200,prot:150,min:8,max:12,days:'Di, Do, So',goal:''},
T:{A:['Latzug','Schrägbankdrücken','Seitheben','Beinpresse','Bizepscurls'],B:['Rudern','Brustpresse','Beinbeuger','Trizepsdrücken','Wadenheben'],C:['Seitheben','Beinpresse','Latzug eng','Schrägbankdrücken','Bauchtraining']},
S:[],M:[],B:[]};
let D;try{D=JSON.parse(localStorage.getItem(K))||null}catch(e){D=null}
D=Object.assign(JSON.parse(JSON.stringify(DEF)),D||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const num=x=>parseFloat(String(x).replace(',','.'));
const f1=x=>(Math.round(x*10)/10).toString().replace('.',',');
let tab='train',draft=null,flash='';
const tabs=[['train','Training'],['food','Ernährung'],['body','Körper'],['set','Profil']];
function hud(){let xp=0;D.S.forEach(s=>{xp+=100+s.ex.reduce((a,e)=>a+stats(e.sets).vol,0)/50});const lv=Math.floor(Math.sqrt(xp/100))+1,cur=100*(lv-1)**2,nx=100*lv*lv;const R=lv>=26?'S':lv>=19?'A':lv>=13?'B':lv>=8?'C':lv>=4?'D':'E';return `<div class="c"><div style="display:flex;justify-content:space-between"><b>${esc(D.p.name||'Athlet')}</b><span>Rang <b style="color:var(--ac)">${R}</b> · LV ${lv}</span></div><div class="bar"><i style="width:${(xp-cur)/(nx-cur)*100}%"></i></div><div class="mu">XP ${Math.round(xp)} / ${nx} · ${D.S.length} Quests abgeschlossen</div></div>`}
function insight(s,idx){const t=[],mx=D.p.max,ps=D.S.slice(0,idx).reverse().find(x=>x.type==s.type),pa=D.S[idx-1];
s.ex.forEach(e=>{const n=e.sets.length;if(n>=3&&e.sets[0][0]==e.sets[n-1][0]&&e.sets[n-1][1]<e.sets[0][1]*0.7)t.push(`Bei ${e.n} bricht der letzte Satz von ${e.sets[0][1]} auf ${e.sets[n-1][1]} Wdh. ein. Prüfe die Satzpausen (2–3 min), sonst misst du eher Ermüdung als Kraft.`);
if(n>=3&&e.sets.every(x=>x[1]==e.sets[0][1]&&x[0]==e.sets[0][0])&&e.sets[0][1]<mx)t.push(`Bei ${e.n} sind alle Sätze identisch (${e.sets[0][1]} Wdh.). Das spricht oft für Abbruch deutlich vor dem Limit. Geh im letzten Satz bewusst 1–2 Wdh. näher ran.`);
if(e.sets[0][1]>8)t.push(`${e.n}: Mehr als 8 Wdh. im Top-Set. Prüfe Technik, RIR und die Back-off-Sätze, bevor du das Gewicht erhöhst.`);
if(e.sets.some(x=>x[1]>mx+3))t.push(`${e.n}: Sätze mit mehr als ${mx+3} Wdh. sind meist zu leicht und liefern weniger Wachstumsreiz. Gewicht erhöhen.`)});
if(ps){const g=Math.round((new Date(s.date)-new Date(ps.date))/864e5);if(g>10)t.push(`Zwischen den beiden ${s.type}-Einheiten liegen ${g} Tage. Schwankende Abstände verfälschen den Vergleich stärker als jede Gewichtsänderung.`)}
if(pa&&pa.bw&&s.bw&&Math.abs(s.bw-pa.bw)>=1.5)t.push(`Dein Körpergewicht hat sich seit der letzten Einheit um ${f1(s.bw-pa.bw)} kg verändert. Das beeinflusst Leistung und Vergleichbarkeit (Wasser, Essenszeit).`);
const tot=s.ex.reduce((a,e)=>a+stats(e.sets).vol,0);const big=s.ex.find(e=>tot&&stats(e.sets).vol/tot>0.45&&s.ex.length>2);if(big)t.push(`${big.n} macht über 45 % des Volumens aus. Maschinen-Kilogramm allein sagen wenig über die Belastung der Zielmuskeln. Beurteile Muskelgefühl und Bewegungsumfang mit.`);
const fb=['Eine kontrollierte Negativphase (2–3 s) und volle Dehnung bringen oft mehr als 2,5 kg extra. Notiere zusätzlich, wie viele Wdh. du noch in Reserve hattest (RIR).','Verteile dein Protein auf 3–4 Mahlzeiten mit je etwa 30–40 g. Das wirkt meist besser als ein großer Anteil am Abend.','Gleiche Uhrzeit und ähnlicher Ernährungszustand vor dem Training machen Leistungen vergleichbarer als jede App-Statistik.','Schlaf unter 7 Stunden senkt Leistung und Regeneration spürbar, auch wenn du dich motiviert fühlst. Notiere ihn für ein paar Wochen mit.'];
return '<span style="color:var(--ac)">Versteckter Hinweis des Systems</span><br>'+(t.length?t[idx%t.length]:fb[idx%fb.length])}
function nav(){$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';draft=null;render()">${l}</button>`).join('')}
const e1=(w,r)=>w*(1+r/30);
function nextType(){const l=D.S[D.S.length-1];return l?{A:'B',B:'C',C:'A'}[l.type]:'A'}
function hist(n){const o=[];D.S.forEach(s=>{const x=s.ex.find(e=>e.n.toLowerCase()==n.toLowerCase());if(x)o.push({d:s.date,sets:x.sets})});return o}
function stats(sets){const vol=sets.reduce((a,s)=>a+s[0]*s[1],0),reps=sets.reduce((a,s)=>a+s[1],0),tw=Math.max(...sets.map(s=>s[0])),top=sets.filter(s=>s[0]==tw),best=Math.max(...sets.map(s=>e1(s[0],s[1])));return{vol,reps,tw,top,best}}
const stepOf=w=>w>=20?2.5:w>=10?1:0.5,rnd=w=>Math.round(w/stepOf(w))*stepOf(w);
function rec(n){const h=hist(n);if(!h.length)return{w:null,t:'6–8',b:null,bt:'10–12',why:'Noch keine Vergleichswerte. Beginne mit einem sauberen Top-Set (6–8 Wdh., etwa 1–2 RIR).'};
const last=h[h.length-1].sets,topW=Math.max(...last.map(x=>x[0])),top=last.filter(x=>x[0]===topW),topReps=Math.max(...top.map(x=>x[1]));
const previous=h.slice(-3,-1),consistent=previous.length>0&&previous.every(v=>v.sets.some(x=>x[0]===topW&&x[1]>=8));
const back=last.filter(x=>x[0]<topW),backGood=back.length>=2&&back.every(x=>x[1]>=10);
const drop=last.length>1&&last[last.length-1][0]===topW&&last[last.length-1][1]<topReps*.75;
const ready=topReps>=8&&backGood&&consistent&&!drop;
const step=stepOf(topW),w=ready?topW+step:topW,b=rnd(w*.85),bw=Math.min(b,w-step);
let why=ready?'8 Wdh. im Top-Set, mindestens zwei solide Back-off-Sätze und wiederholt bestätigt: kleine Steigerung sinnvoll.':topReps>=8?'8 Wdh. im Top-Set allein reichen nicht. Erst Back-off-Leistung und Wiederholbarkeit bestätigen, Gewicht halten.':'Top-Set noch unter 8 Wdh.: Gewicht halten und kontrolliert Wiederholungen steigern.';
if(drop)why+=' Deutlicher Einbruch im letzten Satz: Pausen und Erholung prüfen.';
return{w,t:ready?'6–8':`${Math.min(8,Math.max(6,topReps+1))}–8`,r:ready?6:Math.min(8,Math.max(6,topReps+1)),b:bw,br:10,bt:'10–12',alt:ready?topW:null,why};}
function recTxt(n){const r=rec(n);if(!r.w)return `<b>Satz 1 (Top-Set):</b> Gewicht so wählen, dass maximal 8 saubere Wdh. möglich sind.<br><b>Satz 2–3 (Back-off):</b> ca. 15 % leichter, 10–12 Wdh.<br><span class="mu">${r.why}</span>`;return `<b>Satz 1 (Top-Set):</b> ${f1(r.w)} kg × ${r.t} Wdh. (max. 8)<br><b>Satz 2–3 (Back-off):</b> ${f1(r.b)} kg × ${r.bt} Wdh.${r.alt?`<br><span class="mu">Alternativ Top-Set bei ${f1(r.alt)} kg halten</span>`:''}<br><span class="mu">${r.why}</span>`}
function nextPlan(type){return `<div class="c"><h2>Nächste Quest: ${type}</h2>`+D.T[type].map(n=>`<div style="margin:8px 0"><b>${esc(n)}</b><br>${recTxt(n)}</div>`).join('')+'<div class="mu">Übungsreihenfolge konstant halten, Bewegungsumfang vor Gewicht.</div></div>'}
function curW(){const bs=D.B.filter(x=>Number.isFinite(x.bw)).slice().sort((a,b)=>a.d.localeCompare(b.d));if(bs.length)return bs[bs.length-1].bw;const s=[...D.S].reverse().find(x=>x.bw);return s?s.bw:null}
function avgSteps(){const l=D.B.filter(x=>x.st).slice(-7);return l.length?l.reduce((a,x)=>a+x.st,0)/l.length:(D.p.steps||null)}
function energy(){const p=D.p,w=curW(),h=num(p.h),age=new Date().getFullYear()-num(p.year),st=avgSteps();
if(!w||!h||!age||!p.sex)return `<div class="c"><h2>Energiebedarf</h2><div class="mu">Für die Berechnung fehlen: ${[!w&&'Gewicht (Tab Körper)',!h&&'Größe',!p.year&&'Geburtsjahr',!p.sex&&'Geschlecht'].filter(Boolean).join(', ')} (Profil).</div></div>`;
const off=p.sex=='männlich'?5:p.sex=='weiblich'?-161:-78,bmr=10*w+6.25*h-5*age+off,base=bmr*1.15,sk=(st||0)*w*0.00035,nT=(p.days||'').split(/[,;]/).filter(s=>s.trim()).length||3,tk=nT*250/7,tdee=base+sk+tk;
const mode=p.mode||'cut',kc=Math.round(tdee*{cut:.85,hold:1,bulk:1.1}[mode]/10)*10,pr=protT(),fat=Math.round(w*0.8),ch=Math.max(0,Math.round((kc-pr*4-fat*9)/4)),fw=p.sex=='weiblich';
const sg={cut:'8.000–10.000',hold:'7.000–9.000',bulk:'6.000–8.000'}[mode],R=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
const mic=[['Ballaststoffe',Math.round(kc/1000*14)+' g'],['Wasser',(w*0.035+0.5).toFixed(1).replace('.',',')+' L (Trainingstag)'],['Eisen',fw?'15 mg':'10 mg'],['Magnesium',fw?'300 mg':'350 mg'],['Calcium','1.000 mg'],['Zink',fw?'8 mg':'11 mg'],['Kalium','4.000 mg'],['Vitamin C',fw?'95 mg':'110 mg'],['Vitamin D','20 µg'],['Jod','200 µg'],['Omega-3 (EPA+DHA)','ca. 250–500 mg']];
return `<div class="c"><h2>Energiebedarf</h2><table>${R('Grundumsatz (Mifflin-St Jeor)','<b>'+Math.round(bmr)+' kcal</b>')}${R('Alltag und Verdauung (+15 %)','+'+Math.round(base-bmr))}${R('Schritte (Ø '+(st?Math.round(st).toLocaleString('de-DE'):'?')+')','+'+Math.round(sk))}${R('Krafttraining ('+nT+'×/Woche, ca. 250 kcal)','+'+Math.round(tk))}${R('Gesamtumsatz','<b>'+Math.round(tdee)+' kcal</b>')}</table>
<div class="mu" style="margin-top:6px">Empfohlene Schritte: ${sg} pro Tag. Schrittkalorien sind nur eine grobe Näherung; Tempo, Strecke und bereits erfasste Alltagsaktivität beeinflussen den tatsächlichen Mehrverbrauch.</div></div>
<div class="c"><h2>Tagesziel (${{cut:'Fettabbau, ca. −15 %',hold:'Halten',bulk:'Aufbau, ca. +10 %'}[mode]})</h2><table>${R('Kalorien','<b>'+kc+' kcal</b>')}${R('Protein',pr+' g ('+f1(pr/w)+' g/kg)')}${R('Fett',fat+' g (0,8 g/kg)')}${R('Kohlenhydrate',ch+' g')}</table><button class="b" onclick="D.p.kcal=${kc};D.p.prot=${pr};save();render()">Als Tagesziel übernehmen</button>
<h2 style="margin-top:14px">Mikronährstoffe (Richtwerte)</h2><table>${micRef().map(m=>R(m[1],String(m[3]).replace('.',',')+' '+m[2])).join('')}</table><div class="mu" style="margin-top:6px">Alle Werte sind Schätzungen; der tatsächliche Verbrauch kann deutlich stärker abweichen. Die Mikro-Richtwerte orientieren sich grob an DGE-Referenzwerten und berücksichtigen Geschlecht, Alter, Gewicht (Wasser) und Kalorien (Ballaststoffe), nicht die Größe. Kein Ersatz für ärztliche Beratung.</div></div>`}
function recOld(n){const h=hist(n);if(!h.length)return{w:null,t:D.p.min,why:'Keine Vorwerte: Startgewicht so wählen, dass '+D.p.min+'–'+D.p.max+' Wdh. sauber möglich sind.'};
const L=stats(h[h.length-1].sets),mn=D.p.min,mx=D.p.max;const topR=L.top.map(s=>s[1]);
if(L.top.length>=3&&Math.min(...topR)>=mx){const inc=L.tw>=40?2.5:1.25;return{w:L.tw+inc,t:mn,alt:L.tw,why:`Alle Arbeitssätze bei ${f1(L.tw)} kg: ${mx} Wdh. erreicht, daher Gewicht erhöhen. Technik und Bewegungsumfang zuerst prüfen.`}}
if(Math.min(...topR)<mn)return{w:L.tw,t:mn,why:`Unter ${mn} Wdh. bei ${f1(L.tw)} kg: Last und Technik prüfen, Gewicht halten, nicht erhöhen.`};
return{w:L.tw,t:Math.min(mx,Math.min(...topR)+1),why:`Gewicht halten und Wdh. verbessern (letztes Mal ${topR.join('/')}).`}}
function planText(type){return D.T[type].map(n=>{const r=rec(n);return n+': '+(r.w?Array(3).fill(f1(r.w)+'x'+r.t).join(' '):'')}).join('\n')}
function parse(txt){const ex=[];txt.split('\n').forEach(l=>{const i=l.indexOf(':');if(i<1)return;const n=l.slice(0,i).trim();const sets=[...l.slice(i+1).matchAll(/(\d+(?:[.,]\d+)?)\s*[x×]\s*(\d+)/gi)].map(m=>[num(m[1]),parseInt(m[2])]);if(sets.length)ex.push({n,sets})});return ex}
function analyse(s,idx){let out='',tot=0,nsets=0,notes=[];
const prev=[...D.S].slice(0,idx).reverse().find(x=>x.type==s.type);
s.ex.forEach(e=>{const st=stats(e.sets);tot+=st.vol;nsets+=e.sets.length;
const before=D.S.slice(0,idx).map(x=>x.ex.find(y=>y.n.toLowerCase()==e.n.toLowerCase())).filter(Boolean);
let cmp='<span class="mu">Erste Erfassung</span>',pr='';
if(before.length){const pb=stats(before[before.length-1].sets),d=(st.best/pb.best-1)*100;
cmp=d>2?`<span class="ok">Steigerung (e1RM ${d.toFixed(1)} %)</span>`:d<-2?`<span class="bad">Rückgang (e1RM ${d.toFixed(1)} %)</span>`:'Stagnation / im Messrauschen';
cmp+=`, Volumen ${st.vol>=pb.vol?'+':''}${Math.round(st.vol-pb.vol)} kg`;
const allbest=Math.max(...before.map(b=>stats(b.sets).best));if(st.best>allbest*1.005)pr=' 🏆 neuer Bestwert (e1RM)';
let ns=0;for(let i=before.length-1;i>=0;i--){const bb=stats(before[i].sets).best;const prior=Math.max(0,...before.slice(0,i).map(b=>stats(b.sets).best));if(bb<=prior*1.005)ns++;else break}
if(st.best<=allbest*1.005&&ns>=2)notes.push(`${e.n}: seit ${ns+1} Einheiten kein Fortschritt, mögliche Anpassung prüfen.`)}
const ws=[...new Set(e.sets.map(x=>x[0]))];
const tb=ws.length>1?`<div class="mu">Top-Set: ${f1(st.tw)}×${e.sets.find(x=>x[0]==st.tw)[1]}; Back-off getrennt bewerten.</div>`:'';
out+=`<div style="margin:8px 0"><b>${esc(e.n)}</b>${pr}<br>${e.sets.map(x=>f1(x[0])+'×'+x[1]).join(', ')} · ${st.reps} Wdh. · ${Math.round(st.vol)} kg<br>${cmp}${tb}</div>`});
let pv='';if(prev){const pt=prev.ex.reduce((a,e)=>a+stats(e.sets).vol,0);pv=`Vorherige Einheit ${prev.type}: ${Math.round(pt)} kg (${tot>=pt?'+':''}${Math.round(tot-pt)}). Mehr Volumen ist nicht automatisch mehr Muskelaufbau.`}
const weak=D.S.slice(Math.max(0,idx-2),idx+1).length==3&&notes.length>=2;
return `<div class="c"><h2>Übersicht</h2>${s.date} · Typ ${s.type} · Körpergewicht ${s.bw?f1(s.bw)+' kg':'unbekannt'}<br>${nsets} Sätze · Gesamtvolumen ${Math.round(tot)} kg<br><span class="mu">${pv}</span></div>
<div class="c"><h2>Übungsanalyse</h2>${out}</div>
${recov(s,idx)}<div class="c"><h2>Übersehen</h2>${insight(s,idx)}</div>
<div class="c"><h2>Auffälligkeiten</h2>${notes.length?notes.map(n=>'• '+esc(n)).join('<br>'):'Keine Plateaus erkannt.'}${weak?'<br>• Mehrere stagnierende Übungen: Schlaf, Stress, Ernährung prüfen. Ein Deload erst nach mehreren schwachen Einheiten.':''}</div>`}
function nextPlanOld(type){return `<div class="c"><h2>Nächste Quest: ${type}</h2>`+D.T[type].map(n=>{const r=rec(n);return `<div style="margin:8px 0"><b>${esc(n)}</b>: ${r.w?`${f1(r.w)} kg × ${r.t} Wdh. (3 Sätze)${r.alt?`<br><span class="mu">Alternativ: ${f1(r.alt)} kg halten</span>`:''}`:'Gewicht wählen'}<br><span class="mu">${r.why}</span></div>`}).join('')+'<div class="mu">Übungsreihenfolge konstant halten, Bewegungsumfang vor Gewicht.</div></div>'}
function newDraft(t){return{type:t,ex:[],cur:null,date:today(),bw:''}}
function exList(){const d=draft;return D.T[d.type].concat(d.ex.map(e=>e.n).filter(n=>!D.T[d.type].includes(n)))}
function recTxtOld(n){const r=rec(n);return (r.w?`Ziel: ${f1(r.w)} kg × ${r.t}+ Wdh.`+(r.alt?` (alternativ ${f1(r.alt)} kg halten)`:''):'Startgewicht wählen')+`<br><span class="mu">${r.why}</span>`}
function pick(i){draft.cur=exList()[i];render();setTimeout(()=>{const x=$('#iw');if(x)x.focus()})}
function customEx(){const n=(prompt('Name der Übung')||'').trim();if(n){draft.cur=n;if(!exList().includes(n))draft.ex.push({n,sets:[]});render()}}

function addB(){const bw=num($('#bb').value);if(!Number.isFinite(bw)||bw<=0)return;const d=today(),old=D.B.find(x=>x.d===d);const w=num($('#bt').value),st=parseInt($('#bs').value);if(old){old.bw=bw;if(Number.isFinite(w)&&w>0)old.w=w;if(Number.isFinite(st)&&st>=0)old.st=st}else D.B.push({d,bw,w:Number.isFinite(w)&&w>0?w:null,st:Number.isFinite(st)&&st>=0?st:null});D.B.sort((a,b)=>a.d.localeCompare(b.d));save();render()}
function sett(){const p=D.p;const i=(k,l,t='text')=>`<div><label>${l}</label><input id="p_${k}" type="${t}" value="${esc(p[k])}"></div>`;
return `<div class="c"><h2>Profil</h2><div class="r">${i('name','Name')}${i('year','Geburtsjahr')}${i('h','Größe (cm)')}<div><label>Geschlecht</label><select id="p_sex">${['','männlich','weiblich','divers'].map(x=>`<option ${x==p.sex?'selected':''}>${x}</option>`).join('')}</select></div>${i('kcal','Kalorienziel')}<div><label>Proteinziel (g), automatisch</label><input value="${protT()}" disabled></div>${i('min','Wdh. min')}${i('max','Wdh. max')}${i('steps','Ø Schritte/Tag (ohne Log)')}<div><label>Ziel</label><select id="p_mode">${[['cut','Fettabbau moderat'],['hold','Gewicht halten'],['bulk','Aufbau']].map(([k,l])=>`<option value="${k}" ${(p.mode||'cut')==k?'selected':''}>${l}</option>`).join('')}</select></div></div>
<label>Trainingstage</label><input id="p_days" value="${esc(p.days)}"><label>Körperliche Ziele in Prioritätsreihenfolge</label><textarea id="p_goal" style="min-height:70px;font-family:inherit">${esc(p.goal)}</textarea></div>
<div class="c"><h2>Übungen pro Einheit</h2><div class="mu">Eine Übung pro Zeile. Reihenfolge konstant halten, damit Werte vergleichbar bleiben.</div>${['A','B','C'].map(t=>`<label>Einheit ${t}</label><textarea id="t_${t}" style="min-height:90px;font-family:inherit">${esc(D.T[t].join('\n'))}</textarea>`).join('')}<button class="b" onclick="saveP()">Speichern</button></div>
<div class="c"><h2>Startdaten</h2><div class="mu">Lädt 22 Quests (01.09.–20.10.2026), Gewichte und deine Profilwerte aus dem Prompt. Vorhandene Daten bleiben, doppelte Tage werden übersprungen.</div><button class="b" onclick="seed()">Meine Startdaten laden</button></div>
<div class="c"><h2>Backup</h2><div class="mu">Die Daten liegen nur in diesem Browser. Exportiere sie regelmäßig.</div><button class="b" onclick="exp()">Backup exportieren</button><label>Backup wiederherstellen (Datei)</label><input type="file" accept=".json,application/json" onchange="rest(this.files[0])"></div>
<div class="c"><h2>Frühere Quests importieren</h2><div class="mu">Pro Quest ein Block, Blöcke durch eine Leerzeile trennen. Erste Zeile: Datum Typ Gewicht (optional), danach pro Übung eine Zeile.</div><textarea id="imp" placeholder="2026-10-04 A 77,5&#10;Latzug: 50x8 42,5x10 42,5x10"></textarea><button class="b" onclick="imp()">Importieren</button></div>
<div class="c"><h2>Daten</h2><button class="b" style="background:var(--bad)" onclick="if(confirm('Alle Daten löschen?')){D=JSON.parse(JSON.stringify(DEF));save();render()}">Alles zurücksetzen</button></div>`}
function imp(){const bl=$('#imp').value.split(/\n\s*\n/);let n=0;bl.forEach(b=>{const ls=b.trim().split('\n');const m=ls[0].match(/(\d{4}-\d{2}-\d{2})\s+([ABC])\s*([\d.,]+)?/i);if(!m)return;const ex=parse(ls.slice(1).join('\n'));if(!ex.length)return;if(D.S.some(q=>q.date===m[1]&&q.type===m[2].toUpperCase()))return;D.S.push({date:m[1],type:m[2].toUpperCase(),bw:m[3]?num(m[3]):null,ex});n++});D.S.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);save();alert(n+' Quest(s) importiert');render()}
function exp(){const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fit-coach-backup-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function rest(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!x.S||!x.p)throw 0;if(!confirm('Aktuelle Daten durch das Backup ersetzen?'))return;D=Object.assign(JSON.parse(JSON.stringify(DEF)),x);save();render()}catch(e){alert('Ungültige Backup-Datei')}};r.readAsText(f)}
function saveP(){['name','year','h','sex','days','goal','mode'].forEach(k=>D.p[k]=$('#p_'+k).value);['kcal','min','max','steps'].forEach(k=>D.p[k]=num($('#p_'+k).value)||DEF.p[k]);['A','B','C'].forEach(t=>D.T[t]=$('#t_'+t).value.split('\n').map(s=>s.trim()).filter(Boolean));save();alert('Gespeichert');render()}
function render(){nav();$('#v').innerHTML=hud()+{train,food,body,set:sett}[tab]();showT()}
render();
</script></body></html>
